name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Snapshot script syntax
        run: node --check skills/app-store-review-preflight/scripts/asc_snapshot.js
